
name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-13

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Assets
        run: ./gradlew pack

      - name: Build iOS App
        run: ./gradlew :ios:createIPA -Probovm.iosSkipSigning=true -Probovm.archs=arm64

      - name: Package IPA
        run: |
          mkdir -p Payload
          if [ -d "ios/build/robovm/IOSLauncher.app" ]; then
            cp -r ios/build/robovm/IOSLauncher.app Payload/
            zip -r Mindustry.ipa Payload
          elif [ -f "ios/build/robovm/IOSLauncher.ipa" ]; then
            cp ios/build/robovm/IOSLauncher.ipa Mindustry.ipa
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mindustry-iOS-IPA
          path: Mindustry.ipa
